name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.2.3)'
        required: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  prepare:
    name: Resolve tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      is-prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - name: Resolve version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(a|alpha|b|beta|rc)[.-]?[0-9]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.tag.outputs.version }}

  quality:
    name: Validate release
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Prepare workspace
        uses: ./.github/actions/setup-environment
        with:
          python-version: "3.11"
          cache-suffix: "-release-quality"

      - name: Ruff format (check)
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pylint
        run: uv run pylint --fail-under=9.5 src scripts

      - name: Pyright
        run: uv run pyright

      - name: Run release test profile
        run: uv run python scripts/dev.py test --profile ci

  build-artifacts:
    name: Build distributions
    runs-on: ubuntu-latest
    needs:
      - prepare
      - quality
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.VERSION }}

      - name: Prepare workspace
        uses: ./.github/actions/setup-environment
        with:
          python-version: "3.11"
          cache-suffix: "-release-build"

      - name: Align pyproject version
        run: |
          RAW_VERSION="${VERSION#v}"
          sed -i "s/^version = \".*\"$/version = \"${RAW_VERSION}\"/" pyproject.toml
          grep '^version =' pyproject.toml

      - name: Build distributions
        run: uv build

      - name: Verify metadata
        run: |
          uv tool install twine
          uv tool run twine check dist/*

      - name: Verify installed version
        run: |
          set -euo pipefail
          expected="$(
            uv run python -c 'import os; from packaging.version import Version; print(Version(os.environ["VERSION"].removeprefix("v")))'
          )"
          smoke_venv="${RUNNER_TEMP}/release-smoke"
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"

          uv venv --python 3.11 "$smoke_venv"
          uv pip install --python "$smoke_venv/bin/python" --no-deps "$wheel"
          "$smoke_venv/bin/python" -I - "$expected" <<'PY'
          from importlib.metadata import version
          import sys

          import src

          expected = sys.argv[1]
          installed = version("ai-docs-vector-db-hybrid-scraper")
          assert installed == expected, f"{installed=} != {expected=}"
          assert src.__version__ == expected, f"{src.__version__=} != {expected=}"
          print(f"Verified installed version {installed}")
          PY

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          retention-days: 30

  security-report:
    name: Security report
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-artifacts
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.prepare.outputs.version }}

      - name: Prepare workspace
        uses: ./.github/actions/setup-environment
        with:
          python-version: "3.11"
          cache-suffix: "-release-security"

      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-dist
          path: dist

      - name: Install security tooling
        run: |
          uv tool install pip-audit
          uv tool install bandit

      - name: Run dependency and code scans
        run: |
          set -euo pipefail

          pip_audit_status=0
          bandit_status=0

          {
            echo "# Security scan"
            echo
            echo "## Dependency vulnerabilities"
          } > security-report.md

          if uv tool run pip-audit --format=markdown >> security-report.md; then
            echo >> security-report.md
            echo "_No dependency vulnerabilities detected._" >> security-report.md
          else
            pip_audit_status=$?
            echo >> security-report.md
            echo "_pip-audit exited with status ${pip_audit_status}. Review the output above._" >> security-report.md
          fi

          {
            echo
            echo "## Code security issues"
          } >> security-report.md

          if uv tool run bandit -r src -f txt >> security-report.md; then
            echo >> security-report.md
            echo "_No code security issues detected._" >> security-report.md
          else
            bandit_status=$?
            echo >> security-report.md
            echo "_Bandit exited with status ${bandit_status}. Review the output above._" >> security-report.md
          fi

          if [ "$pip_audit_status" -ne 0 ] || [ "$bandit_status" -ne 0 ]; then
            echo "Security tooling reported failures. See security-report.md for details." >&2
            exit 1
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report
          path: security-report.md
          retention-days: 30

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-artifacts
      - security-report
    permissions:
      contents: write
    if: >-
      needs.prepare.result == 'success' &&
      needs.build-artifacts.result == 'success' &&
      needs.security-report.result == 'success'
    steps:
      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-dist
          path: release/dist

      - name: Download security report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: security-report
          path: release/security
          if-no-files-found: ignore

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p assets
          shopt -s nullglob

          dist_files=(release/dist/*)
          if [ "${#dist_files[@]}" -eq 0 ]; then
            echo "::error::No distribution artifacts were downloaded." >&2
            exit 1
          fi
          cp "${dist_files[@]}" assets/

          if [ -f release/security/security-report.md ]; then
            cp release/security/security-report.md assets/security-report.md
          else
            echo "::warning::security-report.md not found; security report will be omitted." >&2
          fi

      - name: Create release
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: assets/*
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.is-prerelease == 'true' }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-artifacts
      - github-release
    if: >-
      needs.prepare.outputs.is-prerelease == 'false' &&
      vars.PYPI_PUBLISH_ENABLED == 'true'
    environment: pypi
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    permissions:
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-dist
          path: dist

      - name: Publish package
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          packages-dir: dist
          password: ${{ env.PYPI_API_TOKEN }}

      - name: Report deferred PyPI publication
        if: env.PYPI_API_TOKEN == ''
        run: echo "::notice::PYPI_API_TOKEN is not configured; GitHub release completed without PyPI publication."
