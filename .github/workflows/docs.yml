name: Documentation

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Validate docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Prepare workspace
        uses: ./.github/actions/setup-environment
        with:
          python-version: "3.11"
          cache-suffix: "-docs"
          install-dev: 'false'

      - name: Install documentation dependencies
        run: uv sync --frozen --no-dev --extra docs

      - name: Validate documentation content
        run: uv run --no-sync python scripts/dev.py validate --check-docs --strict

      - name: Build MkDocs site
        run: uv run --no-sync mkdocs build --strict
