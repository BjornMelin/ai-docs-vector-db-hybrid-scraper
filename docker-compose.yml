services:
  # Qdrant Vector Database (shared across modes)
  qdrant:
    image: qdrant/qdrant:v1.16.2
    container_name: qdrant-vector-db
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API (enterprise performance)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__ON_DISK_PAYLOAD=true
      - QDRANT__STORAGE__QUANTIZATION__ALWAYS_RAM=true # Enterprise optimization
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=8 # Enterprise: higher threads
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/6333"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - simple
      - enterprise
    networks:
      - ai-docs-network
    deploy:
      resources:
        limits:
          memory: 2G # simple: 1G, enterprise: 4G via override
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"

  # Dragonfly Cache (enterprise only)
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
    container_name: dragonfly-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    command: ["--logtostderr", "--cache_mode"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - enterprise # Only in enterprise mode
    networks:
      - ai-docs-network
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
          cpus: "1.0"

  # PostgreSQL Database (enterprise only)
  postgres:
    image: postgres:15
    container_name: ai-docs-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ai_docs
      - POSTGRES_USER=ai_docs_user
      - POSTGRES_PASSWORD=secure_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_docs_user -d ai_docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - enterprise
    networks:
      - ai-docs-network

  # Main FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    env_file:
      - path: .env
        required: false
    container_name: ai-docs-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_DOCS_QDRANT__URL=http://qdrant:6333
      - AI_DOCS_CACHE__DRAGONFLY_URL=redis://dragonfly:6379
      - AI_DOCS_FASTEMBED__CACHE_DIR=/app/cache/fastembed
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
    depends_on:
      qdrant:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
        required: false # Only if enterprise
      postgres:
        condition: service_healthy
        required: false # Only if enterprise
    networks:
      - ai-docs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - simple
      - enterprise
    deploy:
      resources:
        limits:
          memory: 2G # simple: 1G, enterprise: 4G via override
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"

  # Monitoring Stack (enterprise only)
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: ai-docs-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    profiles:
      - enterprise
    networks:
      - ai-docs-network

  grafana:
    image: grafana/grafana:13.0.2
    container_name: ai-docs-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    profiles:
      - enterprise
    networks:
      - ai-docs-network

volumes:
  qdrant_data:
  dragonfly_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  ai-docs-network:
    driver: bridge
# Usage:
# Simple mode: docker compose --profile simple up -d
# Enterprise mode: docker compose --profile enterprise up -d
# Override with docker-compose.override.yml for local dev
