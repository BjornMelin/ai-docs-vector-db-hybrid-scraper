apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-docs-system

resources:
  - namespace.yaml
  - qdrant-statefulset.yaml
  - dragonfly-deployment.yaml
  - app-deployment.yaml

configurations:
  - kustomizeconfig/envfrom-references.yaml

# Common ownership labels applied without replacing workload-specific selectors
labels:
  - pairs:
      app.kubernetes.io/part-of: ai-docs-system
      app.kubernetes.io/version: "0.1.0"
      app.kubernetes.io/managed-by: kustomize
    includeTemplates: true

# Common annotations
commonAnnotations:
  documentation: "https://github.com/BjornMelin/ai-docs-vector-db-hybrid-scraper"

# Image transformations (replace with your registry)
images:
  - name: ai-docs-app
    newName: your-registry.com/ai-docs-app
    newTag: "0.1.0"

# Resource patches for different environments
patches:
  - path: patches/production-resources.yaml

# Config map generator for application configuration
configMapGenerator:
  - name: ai-docs-config
    literals:
      - AI_DOCS_ENVIRONMENT=production
      - AI_DOCS_DEBUG=false
      - AI_DOCS_LOG_LEVEL=INFO
      - AI_DOCS_MODE=simple
      - AI_DOCS_CACHE__ENABLE_DRAGONFLY_CACHE=true
      - AI_DOCS_CACHE__DRAGONFLY_URL=redis://dragonfly:6379
      - AI_DOCS_QDRANT__URL=http://qdrant:6333
      - AI_DOCS_QDRANT__COLLECTION_NAME=ai_docs

secretGenerator:
  - name: ai-docs-secrets
    files:
      - secrets/AI_DOCS_OPENAI__API_KEY
